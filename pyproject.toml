[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybercheck"
version = "0.1.0"
description = "Unified local port scanner, domain discovery and infrastructure OSINT dashboard"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "cryptography>=43", "pydantic>=2.8,<3"]

[project.scripts]
cybercheck = "cybercheck.cli:main"

[tool.setuptools.package-data]
cybercheck = ["static/*"]

[tool.setuptools.packages.find]
include = ["cybercheck*"]
